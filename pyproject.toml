[project]
name = "vestaboard-tools"
version = "0.3.0"
description = "Formatter, previewer, and publisher for Vestaboard devices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Corey Bertram" }]
keywords = ["vestaboard", "led", "display", "board", "formatter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://vestaboard.tools"
Repository = "https://github.com/q/vesta"

[project.scripts]
vesta = "vesta:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["vesta"]

[dependency-groups]
dev = [
    "build>=1.4.3",
    "pytest>=9.0.2",
    "twine>=6.2.0",
]
